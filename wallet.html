<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ea"><title>TRIP WALLET — TOKYO / HAKONE 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="wallet.css?v=17.2"></head><body>
<header><div><p class="kicker">TOKYO / HAKONE 2026 · MONEY LOG</p><h1>TRIP / WALLET</h1><p class="sub">旅行記帳獨立頁。手機上快速記下日圓支出，也保留店家、商品與分類。</p></div><nav><a href="index.html">← FIELD GUIDE</a><a href="film-log.html">35 / FILM LOG</a></nav></header>
<main>
<section class="summary"><article><span>TRIP TOTAL</span><b id="tripJpy">¥0</b><small id="tripTwd">≈ NT$0</small></article><article><span>TODAY</span><b id="todayJpy">¥0</b><small id="todayTwd">≈ NT$0</small></article><article class="rate"><span>RATE · ¥1 = NT$</span><input id="rate" type="number" min="0" step="0.001" value="0.21"><small>可自行改成刷卡／換匯實際匯率</small></article></section>
<section class="entry"><div class="section-head"><span>QUICK ENTRY</span><h2>新增支出</h2></div><div class="entry-grid"><label><span>AMOUNT</span><div class="money-input"><select id="currency"><option value="JPY">JPY ¥</option><option value="TWD">TWD NT$</option></select><input id="amount" type="number" inputmode="decimal" placeholder="1200"></div></label><label><span>DATE</span><input id="date" type="date"></label><label><span>CATEGORY</span><select id="category"><option>FOOD</option><option>COFFEE</option><option>SHOPPING</option><option>TOY</option><option>CAMERA</option><option>FILM</option><option>TRANSPORT</option><option>TICKET</option><option>HOTEL</option><option>OTHER</option></select></label><label><span>PAID BY</span><input id="payer" placeholder="我 / 同行者"></label><label class="wide"><span>SHOP / PLACE</span><input id="place" placeholder="例如 レモン社 銀座教会店"></label><label class="wide"><span>ITEM / NOTE</span><input id="item" placeholder="例如 Kodak Gold 200 × 2"></label></div><div class="quick"><button data-q="STPX107" data-cat="SHOPPING">STPX107</button><button data-q="FILM" data-cat="FILM">FILM</button><button data-q="TAXI" data-cat="TRANSPORT">TAXI</button><button data-q="SOFUBI" data-cat="TOY">SOFUBI</button><button data-q="CLOTHING" data-cat="SHOPPING">CLOTHING</button></div><button class="add" id="addExpense">＋ ADD EXPENSE</button></section>
<section class="breakdown"><div class="section-head"><span>BREAKDOWN</span><h2>花去哪裡</h2></div><div id="categories" class="cat-grid"></div></section>
<section class="ledger"><div class="ledger-head"><div><span>LEDGER</span><h2>支出紀錄</h2></div><select id="filter"><option value="ALL">ALL</option><option>FOOD</option><option>COFFEE</option><option>SHOPPING</option><option>TOY</option><option>CAMERA</option><option>FILM</option><option>TRANSPORT</option><option>TICKET</option><option>HOTEL</option><option>OTHER</option></select></div><div id="list"></div></section>
<section class="data"><b>AUTO SAVE</b><p>記帳資料只存在這個瀏覽器。旅行中建議偶爾匯出備份。</p><div><button id="export">EXPORT BACKUP</button><label>IMPORT BACKUP<input id="import" type="file" accept="application/json,.json"></label></div></section>
</main><script src="wallet.js?v=17.2"></script></body></html>
